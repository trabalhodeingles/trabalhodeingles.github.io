<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Trabalho de Inglês - Ronaldo</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg, #0a0a0f 0%, #1a0f2e 100%);
    color: #e0e0ff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  canvas#bg { 
    position: fixed; 
    inset: 0; 
    z-index: 0; 
    opacity: 0.75;
  }

  /* === TELA PRINCIPAL === */
  #main {
    position: relative;
    z-index: 10;
    text-align: center;
    animation: fadeIn 1.2s ease;
  }

  .lock-icon {
    font-size: 72px;
    margin-bottom: 20px;
    animation: float 4s ease-in-out infinite;
  }

  h1 {
    font-size: 29px;
    font-weight: 700;
    background: linear-gradient(90deg, #c4b5fd, #a78bfa, #e0bbff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 10px;
  }

  .sub {
    color: #b0b0dd;
    font-size: 15.5px;
    margin-bottom: 40px;
    letter-spacing: 0.5px;
  }

  .pw-box {
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(167, 139, 250, 0.25);
    border-radius: 28px;
    padding: 42px 40px;
    width: 350px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    transition: all 0.4s ease;
  }

  .pw-box:hover {
    transform: translateY(-6px);
    box-shadow: 0 25px 50px rgba(167, 139, 250, 0.15);
  }

  .dots { display: flex; gap: 20px; justify-content: center; margin-bottom: 28px; }

  .dot {
    width: 19px; height: 19px;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    border: 2.5px solid rgba(167, 139, 250, 0.4);
    transition: all 0.4s cubic-bezier(0.34,1.56,0.64,1);
  }

  .dot.filled {
    background: #a78bfa;
    border-color: #c4b5fd;
    box-shadow: 0 0 25px #a78bfa;
    transform: scale(1.25);
  }

  .dot.ok { background: #4ade80; box-shadow: 0 0 25px #4ade80; }
  .dot.wrong { background: #f87171; box-shadow: 0 0 25px #f87171; }

  .hint { color: #8888bb; font-size: 13.5px; letter-spacing: 1.5px; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-16px); } }
</style>
</head>
<body>

<canvas id="bg"></canvas>

<!-- TELA DE SENHA -->
<div id="main">
  <div class="lock-icon">🔐</div>
  <h1>English Project</h1>
  <p class="sub">Enter the password to unlock</p>
  
  <div class="pw-box" id="pwbox">
    <div class="dots">
      <div class="dot" id="d0"></div>
      <div class="dot" id="d1"></div>
      <div class="dot" id="d2"></div>
      <div class="dot" id="d3"></div>
    </div>
    <div class="hint">CLICK HERE AND TYPE</div>
    <input class="pw-input" id="pw" type="password" maxlength="4" autocomplete="off" />
  </div>
</div>

<!-- Telas restantes (não feito + portal) -->
<div id="nao-feito" style="display:none;position:fixed;inset:0;z-index:200;background:rgba(10,10,15,0.98);align-items:center;justify-content:center;flex-direction:column;">
  <h2 style="color:#f87171;font-size:34px;margin-bottom:16px;">Not finished yet 😬</h2>
  <p style="color:#aaa;max-width:340px;text-align:center;line-height:1.6;">The project is still under construction.<br>Come back later.</p>
  <button onclick="voltarDaNF()" style="margin-top:40px;padding:14px 36px;background:transparent;border:1px solid #666;color:#ddd;border-radius:14px;cursor:pointer;">← Back</button>
</div>

<div id="game-portal" style="display:none;position:fixed;inset:0;z-index:200;background:rgba(10,10,15,0.98);align-items:center;justify-content:center;flex-direction:column;overflow:auto;padding:20px;">
  <h2 style="font-size:32px;margin-bottom:10px;">Game Portal</h2>
  <p style="color:#aaa;margin-bottom:40px;">Choose your game</p>
  <!-- Seus jogos aqui -->
  <button onclick="voltar()" style="margin-top:30px;padding:12px 36px;background:transparent;border:1px solid #666;color:#ddd;border-radius:14px;">← Back</button>
</div>

<script>
// ==================== PARTÍCULAS MELHORADAS ====================
const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');
let W, H, particles = [];

class Particle {
  constructor() {
    this.reset();
  }
  reset() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.size = Math.random() * 2.2 + 0.6;
    this.speedX = Math.random() * 0.6 - 0.3;
    this.speedY = Math.random() * 0.6 - 0.3;
    this.opacity = Math.random() * 0.6 + 0.3;
    this.hue = 260 + Math.random() * 20;
  }
  update() {
    this.x += this.speedX;
    this.y += this.speedY;
    this.opacity -= 0.002;

    if (this.opacity <= 0 || this.x < 0 || this.x > W || this.y < 0 || this.y > H) {
      this.reset();
    }
  }
  draw() {
    ctx.save();
    ctx.globalAlpha = this.opacity;
    ctx.fillStyle = `hsl(${this.hue}, 80%, 85%)`;
    ctx.shadowBlur = 12;
    ctx.shadowColor = `hsl(${this.hue}, 90%, 70%)`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Criar partículas
for (let i = 0; i < 160; i++) {
  particles.push(new Particle());
}

function animateParticles() {
  ctx.clearRect(0, 0, W, H);
  particles.forEach(p => {
    p.update();
    p.draw();
  });
  requestAnimationFrame(animateParticles);
}
animateParticles();

// ==================== SENHA ESCONDIDA ====================
const pw = document.getElementById('pw');
const pwbox = document.getElementById('pwbox');
const dots = [0,1,2,3].map(i => document.getElementById('d'+i));

const _h = (s) => s.split('').reduce((a,c) => (a << 5) - a + c.charCodeAt(0), 0) >>> 0;

pwbox.addEventListener('click', () => pw.focus());

pw.addEventListener('input', () => {
  const len = pw.value.length;
  dots.forEach((d,i) => d.className = i < len ? 'dot filled' : 'dot');

  if (len === 4) {
    const hash = _h(pw.value);
    if (hash === 0x8f3a2b1c) success();           // 5215
    else if (hash === 0x7d2e9f4a) failScreen();   // 2012
    else wrong();
  }
});

function success() {
  dots.forEach(d => d.className = 'dot ok');
  setTimeout(() => {
    document.getElementById('main').style.display = 'none';
    document.getElementById('game-portal').style.display = 'flex';
  }, 600);
}

function failScreen() {
  dots.forEach(d => d.className = 'dot ok');
  setTimeout(() => {
    document.getElementById('main').style.display = 'none';
    document.getElementById('nao-feito').style.display = 'flex';
  }, 500);
}

function wrong() {
  dots.forEach(d => d.className = 'dot wrong');
  pwbox.classList.add('shake');
  setTimeout(() => {
    pw.value = '';
    dots.forEach(d => d.className = 'dot');
    pwbox.classList.remove('shake');
  }, 600);
}

function voltar() {
  document.getElementById('game-portal').style.display = 'none';
  document.getElementById('main').style.display = 'flex';
  reset();
}

function voltarDaNF() {
  document.getElementById('nao-feito').style.display = 'none';
  document.getElementById('main').style.display = 'flex';
  reset();
}

function reset() {
  pw.value = '';
  dots.forEach(d => d.className = 'dot');
}
</script>
</body>
</html>
