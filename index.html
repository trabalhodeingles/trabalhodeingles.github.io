<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabalho de Inglês 8º C</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap');

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            background: white;
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            max-width: 480px;
            width: 90%;
            text-align: center;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            color: #4a4a4a;
            margin-bottom: 8px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .input-group {
            margin: 25px 0;
        }

        input {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border: 2px solid #ddd;
            border-radius: 12px;
            text-align: center;
            transition: all 0.3s;
            outline: none;
        }

        input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.2);
        }

        button {
            width: 100%;
            padding: 15px;
            font-size: 17px;
            font-weight: 600;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .erro {
            color: #e74c3c;
            margin-top: 15px;
            font-size: 15px;
            min-height: 20px;
        }

        .decoration {
            font-size: 50px;
            margin-bottom: 15px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="decoration">📚</div>
        
        <h1>Trabalho de Inglês 8º C</h1>
        <p class="subtitle">Profª Juliana • Turma 8º Ano C</p>
        
        <h2>Digite a senha para acessar o material</h2>
        
        <div class="input-group">
            <input type="password" id="senha" placeholder="••••••••" autofocus>
        </div>
        
        <button onclick="verificarSenha()">Acessar Material</button>
        
        <p class="erro" id="erro"></p>
    </div>

    <script>
        function verificarSenha() {
            const senhaDigitada = document.getElementById("senha").value.trim();
            const erro = document.getElementById("erro");

            if (senhaDigitada === "5215") {
                // Redireciona para Shellshock.io
                window.location.href = "https://shellshock.io/";
            } else {
                erro.textContent = "Senha incorreta. Tente novamente.";
                document.getElementById("senha").value = "";
                document.getElementById("senha").focus();

                // Animação de erro
                erro.style.animation = "none";
                setTimeout(() => {
                    erro.style.animation = "shake 0.4s";
                }, 10);
            }
        }

        // Permitir Enter
        document.getElementById("senha").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                verificarSenha();
            }
        });

        // Animação extra de shake para erro
        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-8px); }
                75% { transform: translateX(8px); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
