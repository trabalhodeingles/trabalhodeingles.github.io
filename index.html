<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabalho de História</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f0f0;
            text-align: center;
            padding: 50px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
        }
        input {
            padding: 12px;
            font-size: 18px;
            width: 200px;
            text-align: center;
            margin: 20px 0;
        }
        button {
            padding: 12px 25px;
            font-size: 16px;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #0055aa;
        }
        .mensagem {
            color: red;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Trabalho de História</h1>
        <p>Professor: Sr. Carlos<br>Turma: 2º Ano B</p>
        
        <h2>Digite a senha para acessar o material:</h2>
        
        <input type="password" id="senha" placeholder="Digite a senha" autofocus>
        <br>
        <button onclick="verificarSenha()">Acessar Material</button>
        
        <p class="mensagem" id="erro"></p>
    </div>

    <script>
        function verificarSenha() {
            const senhaDigitada = document.getElementById("senha").value;
            const erro = document.getElementById("erro");

            if (senhaDigitada === "5215") {
                // Redireciona para o shellshock.io
                window.location.href = "https://shellshock.io/";
            } else {
                erro.textContent = "Senha incorreta. Tente novamente.";
                document.getElementById("senha").value = "";
                document.getElementById("senha").focus();
            }
        }

        // Permite apertar Enter para confirmar
        document.getElementById("senha").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                verificarSenha();
            }
        });
    </script>
</body>
</html>
